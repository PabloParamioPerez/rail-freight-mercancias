[project]
name = "redferro"
version = "0.1.0"
description = "Datos brutos, mapas y grafo de habilitaciones de la red ferroviaria de mercancias en Espana (2015-)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Pablo" }]

dependencies = [
    # OGC / geodata
    "geopandas>=1.0",
    "shapely>=2.0",
    "pyogrio>=0.9",          # fast vector IO (GeoPackage, GML, GeoJSON)
    "owslib>=0.31",          # WFS/WMS/CSW capabilities parsing
    "requests>=2.32",
    "pyproj>=3.6",
    # store + analysis
    "duckdb>=1.1",           # analytical DB; spatial extension loaded at runtime
    "pandas>=2.2",
    "networkx>=3.3",         # dependency graph over habilitacion units
    # declaracion de red PDFs
    "pdfplumber>=0.11",      # table extraction from the Catalogo de Lineas
    # viz
    "folium>=0.17",
    "matplotlib>=3.9",
    # config
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "typer>=0.12",           # CLI entrypoint
    "rich>=13.7",
]

[project.optional-dependencies]
viz-extra = ["lonboard>=0.10", "keplergl>=0.3"]  # heavier interactive maps, optional

[project.scripts]
redferro = "redferro.cli:app"

[dependency-groups]
dev = [
    "ruff>=0.6",
    "mypy>=1.11",
    "pytest>=8.3",
    "pre-commit>=3.8",
    "ipykernel>=6.29",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/redferro"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "PD", "NPY", "RUF"]
ignore = ["E501"]  # line length handled by formatter

[tool.ruff.lint.isort]
known-first-party = ["redferro"]

[tool.mypy]
python_version = "3.11"
plugins = []
ignore_missing_imports = true
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
